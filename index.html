<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title> Chemistry Quiz</title>
    <link rel="stylesheet" href="style.css" />

</head>
<body>
    <main class="quiz-box">
       <!-- Start screeeeennnnnnnnn-->
        <section id="start-screen" class="screen">
            <span class="badge"> Chemistry Quiz</span>
            <h1> CBSE class 10</h1>
            <p class="subtitle">
                PRACTICE CHEMISTRY PYQS OR ELSE I SEND A GHOST TO HAUNT U!!!!
            </p>
            <button id="start-btn" class="primary-btn" type="button"> STart Quizzzzzz</button>

        </section>

        <!-- the actual quiz-->
         <section id="quiz-screen" class="screen hidden">
            <div class="top-bar">
                <span id="status" class="pill score-pill"> Score: 0</span>

            </div>
         </section>
    </main>

    <script src="script.js"> </script>
</body>
</html>
